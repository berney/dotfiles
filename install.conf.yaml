- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

- link:
    ~/.dotfiles: ''
    ~/.gitconfig: gitconfig
    ~/.jq: jq
    ~/.tmux.conf: tmux.conf
    ~/.vim: vim
    ~/.vimrc: vimrc
    ~/.zshrc: zshrc
    ~/.zshrc.d: zshrc.d
    ~/.config/zellij: zellij
    ~/.config/nvim: nvim

- shell:
  - [git submodule update --init --recursive, Installing submodules]
